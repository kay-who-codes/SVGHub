  <g stroke="#F5B16A" stroke-width="4" stroke-linecap="round" opacity="0.6">
    <path d="M78 85 L98 81"/>
    <path d="M62 112 L90 106"/>
    <path d="M82 136 L112 130"/>
    <path d="M144 81 L176 87"/>
    <path d="M150 110 L188 118"/>
