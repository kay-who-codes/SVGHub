  </defs>

  <!-- Leaves -->
  <g fill="#3CB043">
    <ellipse cx="100" cy="42" rx="10" ry="28" transform="rotate(-30 100 42)"/>
    <ellipse cx="128" cy="32" rx="10" ry="30"/>
    <ellipse cx="156" cy="42" rx="10" ry="28" transform="rotate(30 156 42)"/>
